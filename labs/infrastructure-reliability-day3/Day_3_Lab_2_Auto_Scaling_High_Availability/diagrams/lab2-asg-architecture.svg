<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" role="img" aria-labelledby="title desc">
  <title id="title">Lab 2 Auto Scaling Architecture</title>
  <desc id="desc">Application Load Balancer, target group, and Auto Scaling Group across two private subnets in different AZs.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00684A"/>
    </marker>
  </defs>
  <style>
    .frame { fill:#F4FBF6; stroke:#00684A; stroke-width:2; }
    .hdr { fill:#00684A; }
    .ht { font:600 13px Arial,sans-serif; fill:#fff; }
    .pub { fill:#E3F2FD; stroke:#1565C0; stroke-width:1.5; }
    .priv { fill:#FFF3E0; stroke:#E65100; stroke-width:1.5; }
    .box { fill:#fff; stroke:#00684A; stroke-width:1.2; }
    .alb { fill:#E8F5E9; stroke:#2E7D32; stroke-width:1.5; }
    .t { font:600 11px Arial,sans-serif; fill:#001E2B; }
    .b { font:9px Arial,sans-serif; fill:#5C6C75; }
    .arr { stroke:#00684A; stroke-width:1.5; fill:none; marker-end:url(#ah); }
  </style>

  <rect x="10" y="10" width="700" height="460" rx="8" class="frame"/>
  <rect x="10" y="10" width="700" height="28" rx="8" class="hdr"/>
  <rect x="10" y="30" width="700" height="8" class="hdr"/>
  <text x="360" y="30" text-anchor="middle" class="ht">Lab1-VPC  Auto Scaling &amp; High Availability (Lab 2)</text>

  <!-- Internet -->
  <rect x="260" y="48" width="200" height="36" rx="6" class="box"/>
  <text x="360" y="70" text-anchor="middle" class="t">Internet</text>

  <!-- ALB -->
  <rect x="180" y="100" width="360" height="56" rx="6" class="alb"/>
  <text x="360" y="122" text-anchor="middle" class="t">ASG-ALB (Application Load Balancer)</text>
  <text x="360" y="138" text-anchor="middle" class="b">Public-Subnet-A (1a) + Public-Subnet-C (1c) � HTTP:80</text>

  <!-- Target group -->
  <rect x="240" y="176" width="240" height="44" rx="6" class="box"/>
  <text x="360" y="196" text-anchor="middle" class="t">ASG-TG (Target Group)</text>
  <text x="360" y="210" text-anchor="middle" class="b">Health check: HTTP / � 200 OK</text>

  <!-- Private subnets -->
  <rect x="28" y="248" width="320" height="130" rx="6" class="priv"/>
  <text x="188" y="268" text-anchor="middle" class="t">Private-Subnet-B � 10.0.2.0/24 � us-east-1b</text>
  <rect x="48" y="284" width="280" height="52" rx="4" class="box"/>
  <text x="188" y="306" text-anchor="middle" class="t">EC2 Web Server 1</text>
  <text x="188" y="322" text-anchor="middle" class="b">Web-SG � Apache � user data bootstrap</text>
  <text x="188" y="362" text-anchor="middle" class="b">Private-RT � NAT Gateway</text>

  <rect x="372" y="248" width="320" height="130" rx="6" class="priv"/>
  <text x="532" y="268" text-anchor="middle" class="t">Private-Subnet-C � 10.0.4.0/24 � us-east-1c</text>
  <rect x="392" y="284" width="280" height="52" rx="4" class="box"/>
  <text x="532" y="306" text-anchor="middle" class="t">EC2 Web Server 2</text>
  <text x="532" y="322" text-anchor="middle" class="b">Web-SG � Apache � user data bootstrap</text>
  <text x="532" y="362" text-anchor="middle" class="b">Private-RT � NAT Gateway</text>

  <!-- ASG box -->
  <rect x="28" y="396" width="664" height="58" rx="6" class="pub"/>
  <text x="360" y="418" text-anchor="middle" class="t">WebServer-ASG � Launch Template: WebServer-LT</text>
  <text x="360" y="434" text-anchor="middle" class="b">Min: 2 � Desired: 2 � Max: 6 � Scale-on-CPU target 70% � ELB health checks � Auto-healing</text>

  <line x1="360" y1="84" x2="360" y2="100" class="arr"/>
  <line x1="360" y1="156" x2="360" y2="176" class="arr"/>
  <line x1="360" y1="220" x2="188" y2="248" class="arr"/>
  <line x1="360" y1="220" x2="532" y2="248" class="arr"/>
</svg>
