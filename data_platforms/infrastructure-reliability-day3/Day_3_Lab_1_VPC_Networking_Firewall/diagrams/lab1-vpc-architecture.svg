<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" role="img" aria-labelledby="title desc">
  <title id="title">Lab 1 VPC Architecture</title>
  <desc id="desc">Custom VPC with public, private, and firewall subnets, IGW, NAT Gateway, and AWS Network Firewall.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00684A"/>
    </marker>
  </defs>
  <style>
    .frame { fill:#F4FBF6; stroke:#00684A; stroke-width:2; }
    .hdr { fill:#00684A; }
    .ht { font:600 13px Arial,sans-serif; fill:#fff; }
    .pub { fill:#E3F2FD; stroke:#1565C0; stroke-width:1.5; }
    .priv { fill:#FFF3E0; stroke:#E65100; stroke-width:1.5; }
    .fw { fill:#FCE4EC; stroke:#C2185B; stroke-width:1.5; }
    .box { fill:#fff; stroke:#00684A; stroke-width:1.2; }
    .t { font:600 11px Arial,sans-serif; fill:#001E2B; }
    .b { font:9px Arial,sans-serif; fill:#5C6C75; }
    .arr { stroke:#00684A; stroke-width:1.5; fill:none; marker-end:url(#ah); }
    .igw { fill:#E8F5E9; stroke:#2E7D32; stroke-width:1.2; }
  </style>

  <rect x="10" y="10" width="700" height="400" rx="8" class="frame"/>
  <rect x="10" y="10" width="700" height="28" rx="8" class="hdr"/>
  <rect x="10" y="30" width="700" height="8" class="hdr"/>
  <text x="360" y="30" text-anchor="middle" class="ht">Lab1-VPC  10.0.0.0/16</text>

  <!-- Public subnet -->
  <rect x="28" y="52" width="320" height="130" rx="6" class="pub"/>
  <text x="188" y="72" text-anchor="middle" class="t">Public-Subnet-A (10.0.1.0/24)  us-east-1a</text>
  <rect x="48" y="84" width="120" height="48" rx="4" class="igw"/>
  <text x="108" y="104" text-anchor="middle" class="t">Lab1-IGW</text>
  <text x="108" y="120" text-anchor="middle" class="b">Internet Gateway</text>
  <rect x="188" y="84" width="140" height="48" rx="4" class="box"/>
  <text x="258" y="104" text-anchor="middle" class="t">Lab1-NAT</text>
  <text x="258" y="120" text-anchor="middle" class="b">NAT Gateway + EIP</text>
  <text x="188" y="148" text-anchor="middle" class="b">Public-RT: 0.0.0.0/0 � IGW</text>

  <!-- Firewall subnet -->
  <rect x="368" y="52" width="324" height="130" rx="6" class="fw"/>
  <text x="530" y="72" text-anchor="middle" class="t">Firewall-Subnet-A (10.0.3.0/24)  us-east-1a</text>
  <rect x="408" y="84" width="244" height="56" rx="4" class="box"/>
  <text x="530" y="106" text-anchor="middle" class="t">Lab1-Firewall</text>
  <text x="530" y="122" text-anchor="middle" class="b">AWS Network Firewall</text>
  <text x="530" y="148" text-anchor="middle" class="b">Firewall-RT: local routes only</text>

  <!-- Private subnet -->
  <rect x="28" y="200" width="664" height="120" rx="6" class="priv"/>
  <text x="360" y="220" text-anchor="middle" class="t">Private-Subnet-B (10.0.2.0/24)  us-east-1b</text>
  <rect x="248" y="236" width="224" height="56" rx="4" class="box"/>
  <text x="360" y="258" text-anchor="middle" class="t">Web Servers (future)</text>
  <text x="360" y="274" text-anchor="middle" class="b">Web-SG � Web-Subnet-NACL</text>
  <text x="360" y="302" text-anchor="middle" class="b">Private-RT: 0.0.0.0/0 � NAT Gateway</text>

  <!-- Internet -->
  <rect x="28" y="340" width="664" height="52" rx="6" class="box"/>
  <text x="360" y="362" text-anchor="middle" class="t">Internet</text>
  <text x="360" y="378" text-anchor="middle" class="b">Public subnet reaches internet via IGW � Private subnet outbound via NAT</text>

  <line x1="108" y1="132" x2="108" y2="340" class="arr"/>
  <line x1="258" y1="132" x2="360" y2="200" class="arr"/>
</svg>
